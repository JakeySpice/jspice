<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jake Spicer</title>
  <meta name="description" content="The personal website of Jake Spicer.">
  <meta name="theme-color" content="#f4f1ea">

  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f1ea;
      --text: #171717;
      --muted: #68645d;
      --line: #d8d2c7;
      --accent: #8c2f39;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #151513;
        --text: #f4f1ea;
        --muted: #aaa59b;
        --line: #37342f;
        --accent: #df8d95;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100%, 42rem);
    }

    .eyebrow {
      margin: 0 0 1.25rem;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.2rem, 12vw, 7rem);
      font-weight: 400;
      line-height: 0.92;
      letter-spacing: -0.055em;
    }

    .intro {
      max-width: 35rem;
      margin: 2rem 0 0;
      color: var(--muted);
      font-size: clamp(1.1rem, 2.5vw, 1.35rem);
      line-height: 1.55;
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      gap: 0.8rem 1.2rem;
      align-items: center;
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 0.9rem;
    }

    a {
      color: var(--text);
      text-decoration-color: var(--accent);
      text-underline-offset: 0.22em;
    }

    a:hover {
      color: var(--accent);
    }
  </style>
</head>

<body>
  <main>
    <p class="eyebrow">jspice.au</p>

    <h1>Jake<br>Spicer</h1>

    <p class="intro">
      A small corner of the internet for notes, projects, ideas,
      and other things worth keeping.
    </p>

    <footer>
      <span>Site under construction.</span>
      <!-- Replace the address below when your domain email is ready. -->
      <a href="mailto:hello@jspice.au">hello@jspice.au</a>
    </footer>
  </main>
</body>
</html>
